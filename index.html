<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Hồng Quân | Graduation 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        body { background-color: #FDFBF7; color: #4A3728; margin: 0; font-family: 'Inter', sans-serif; }
        .gold-title { color: #8B0000; font-family: 'Playfair Display', serif; }
        .section-header { background-color: #8B0000; color: white; padding: 15px; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin: 30px 0; font-family: 'Playfair Display', serif; }
        
        /* Layout Kể chuyện */
        .story-chapter { margin-bottom: 50px; padding: 0 20px; }
        .story-img { width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Lưu bút cùng màu nền */
        .guestbook-section { padding: 40px 20px; background-color: #FDFBF7; text-align: center; }
        .guestbook-form { max-width: 500px; margin: auto; padding: 20px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #8B0000; border-radius: 5px; background: #fff; box-sizing: border-box; }
        button { background: #8B0000; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- NHẠC NỀN -->
    <div style="text-align: center; padding: 20px;">
        <p style="font-size: 12px; font-style: italic;">🎵 Chạm vào màn hình để nghe nhạc</p>
        <audio id="bg-music" loop><source src="assets/music/nhac-nen.mp3.mp3" type="audio/mpeg"></audio>
    </div>

    <!-- HERO -->
    <section style="text-align: center; padding: 20px;">
        <img src="assets/logo/logo.jpeg" style="max-width: 130px; border-radius: 8px;">
        <h1 class="gold-title" style="font-size: 32px; margin-top: 15px;">NGUYỄN HỒNG QUÂN</h1>
        <p>Cử nhân Luật Kinh tế | Học viện Chính sách và Phát triển</p>
    </section>

    <!-- ALBUM ẢNH -->
    <div class="section-header">HÀNH TRÌNH 4 NĂM</div>
    <div class="story-chapter">
        <img src="assets/images/IMG_1223.jpeg" class="story-img">
        <img src="assets/images/IMG_1489.jpeg" class="story-img">
    </div>

    <!-- LƯU BÚT -->
    <div class="section-header">SỔ LƯU BÚT</div>
    <section class="guestbook-section">
        <form action="https://formspree.io/f/xxxxx" method="POST" class="guestbook-form">
            <input type="text" name="name" placeholder="Tên của bạn*" required>
            <textarea name="message" placeholder="Lời chúc của bạn*" required></textarea>
            <button type="submit">GỬI LỜI CHÚC</button>
        </form>
    </section>

    <!-- FOOTER CHUẨN -->
    <footer style="text-align: center; padding: 40px 20px; background-color: #FDFBF7; font-size: 14px; border-top: 1px solid #ddd;">
        <p>© 2026 Nguyễn Hồng Quân. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init();
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bg-music');
            if(music.paused) music.play();
        }, { once: true });
    </script>
</body>
</html>
